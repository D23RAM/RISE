<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>RISE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Manrope:wght@400;500;700&display=swap">
<style>
:root{--bg:#090d2b;--card:#141a4a;--line:#272e72;--tx:#eceefc;--mu:#9aa1d8;--lav:#b8a9ff;--pu:#7c5cff;--ok:#6ee7b7;--warn:#fbbf77;--bad:#ff8aa1;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:15px/1.5 Manrope,system-ui,sans-serif;color:var(--tx);background:radial-gradient(900px 500px at 85% -10%,#3a2a9a55,transparent),radial-gradient(700px 500px at -10% 30%,#1c3a8a44,transparent),var(--bg);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:500;margin:0}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#090d2bdd;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.w{max-width:1100px;margin:0 auto;padding:0 18px}
.hd{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}.hd h1{font-size:20px}.hd small{color:var(--mu)}
nav{display:flex;gap:4px;overflow-x:auto;margin-left:auto}
nav button{background:none;border:0;color:var(--mu);font:inherit;font-weight:500;padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--pu);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
main{padding:24px 18px 60px;max-width:1100px;margin:0 auto}
.card{background:linear-gradient(160deg,#1a2159,var(--card));border:1px solid var(--line);border-radius:22px;padding:20px}
.g{display:grid;gap:16px}.g3{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.mt{margin-top:16px}.mu{color:var(--mu)}.big{font-family:Fraunces,serif;font-size:32px;line-height:1.1}
.st .l{color:var(--mu);font-size:13px}.st .s{color:var(--mu);font-size:12px;margin-top:2px}
.hero{display:flex;gap:28px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#3b2a9c,#18215e 60%,#101646)}
.hero h2{font-size:28px;max-width:440px}.ring{width:170px;height:170px;flex:none}
.rb{fill:none;stroke:#ffffff1f;stroke-width:14}.rf{fill:none;stroke:var(--lav);stroke-width:14;stroke-linecap:round;animation:rd 1.2s ease-out}
@keyframes rd{from{stroke-dashoffset:440}}@media(prefers-reduced-motion:reduce){.rf{animation:none}}
.rt{fill:#fff;font:500 34px Fraunces,serif}
.bar{height:8px;border-radius:9px;background:#ffffff22;overflow:hidden;margin:10px 0;max-width:380px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pu),var(--lav))}
.btn{background:var(--pu);color:#fff;border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn.s2{background:#ffffff14;color:var(--tx)}.btn.d{background:#ff8aa122;color:var(--bad)}
.ch{width:100%;height:auto;display:block}.gl{stroke:#ffffff14}.ax{fill:var(--mu);font-size:11px}.tg{stroke:var(--warn);stroke-dasharray:5 4}.tgt{fill:var(--warn);font-size:11px}.stub{fill:#ffffff1f}
.empty{text-align:center;color:var(--mu);padding:38px 12px;border:1px dashed var(--line);border-radius:16px}
.empty b{display:block;color:var(--tx);font-family:Fraunces,serif;font-size:19px;font-weight:500;margin-bottom:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.cal .h{text-align:center;color:var(--mu);font-size:12px}
.cal button{aspect-ratio:1;border-radius:12px;border:1.5px solid transparent;background:#ffffff0d;color:var(--tx);font:inherit;cursor:pointer;position:relative}
.cal button:disabled{opacity:.25;cursor:default}.cal button.sel{border-color:var(--lav)}.cal button.tdy{color:var(--lav);font-weight:700}
.cal button.ok{background:#6ee7b733}.cal button.no{background:#fbbf7733}.cal button.re{border-style:dashed;border-color:#ffffff66}.cal button.sel.re{border-color:var(--lav)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px}
input[type=time],input[type=number],textarea{width:100%;background:#0a0f33;color:var(--tx);border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit}
.f2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}@media(max-width:520px){.f2{grid-template-columns:1fr 1fr}}
.rt5{display:flex;gap:6px}.rt5 button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:#0a0f33;color:var(--mu);font:inherit;cursor:pointer}.rt5 button.on{background:var(--pu);color:#fff;border-color:var(--pu)}
.pv{background:#0a0f33;border-radius:14px;padding:12px 14px;margin-top:14px;font-size:14px}.pv b{font-family:Fraunces,serif;font-weight:500;font-size:20px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;background:#ffffff14}.pill.ok{background:#6ee7b733;color:var(--ok)}.pill.no{background:#fbbf7733;color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}th{color:var(--mu);font-weight:500}
.wrap{overflow-x:auto}.mo{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:20;padding:18px}.mo .card{width:min(640px,100%);background:#141a4a}.mo textarea{height:240px;font:12px monospace}
.msg{color:var(--bad);font-size:13px;margin-top:8px}.leg{display:flex;gap:14px;font-size:12px;color:var(--mu);flex-wrap:wrap;margin-top:10px}
.pop textarea{height:170px}
@media print{:root{--bg:#fff;--card:#fff;--tx:#111;--mu:#555;--line:#ccc;--lav:#5b3fd0;--pu:#5b3fd0}body{background:#fff}body::before,header,.noprint{display:none!important}.card{background:#fff;break-inside:avoid;border-color:#ccc}.gl{stroke:#ddd}.pop textarea{border:1px solid #ccc;background:#fff;color:#111}}
</style></head><body>
<header><div class="w hd"><div><h1>RISE &amp; Sleep Tracker</h1><small>26 Oct 2026 – 7 Feb 2027 · goal: 7 hours a night</small></div><nav id="nav"></nav></div></header>
<main id="app"></main><div id="mo"></div>
<script>
const START="2026-10-26",END="2027-02-07",TGT=420,$=s=>document.querySelector(s);
const P=d=>{const[a,b,c]=d.split("-").map(Number);return Date.UTC(a,b-1,c)};
const F=t=>{const d=new Date(t);return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0")};
const add=(d,n)=>F(P(d)+n*864e5),tm=s=>{const[h,m]=s.split(":").map(Number);return h*60+m};
const hm=m=>{m=Math.round(Math.abs(m));return Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m"};
const clock=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0")};
const span=(a,b)=>(((tm(b)-tm(a))%1440)+1440)%1440;
const wd=d=>new Date(P(d)).toLocaleDateString("en-GB",{weekday:"short",timeZone:"UTC"}),dm=d=>new Date(P(d)).toLocaleDateString("en-GB",{day:"numeric",month:"short",timeZone:"UTC"});
const lon=d=>new Date(P(d)).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric",timeZone:"UTC"});
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const clamp=d=>d<START?START:d>END?END:d;
let S={v:"dash",entries:{},refl:"",modal:"",msg:""};
try{const r=JSON.parse(localStorage.getItem("sdt1")||"{}");S.entries=r.entries||{};S.refl=r.refl||""}catch(e){}
const save=()=>{try{localStorage.setItem("sdt1",JSON.stringify({entries:S.entries,refl:S.refl}))}catch(e){}};
// A night belongs to the day you wake up. Durations wrap across midnight with modulo 24h.
function calc(e){if(!e||!e.bed||!e.wake)return null;const inbed=span(e.bed,e.wake);if(!inbed)return null;const a=e.asleep||e.bed;
if(span(e.bed,a)>inbed)return{err:"The fell-asleep time must fall between bedtime and wake-up."};const sleep=span(a,e.wake);
return{inbed,sleep,diff:sleep-TGT,ok:sleep>=TGT,bedN:tm(e.bed)<720?tm(e.bed)+1440:tm(e.bed),wakeM:tm(e.wake)}}
const L=()=>Object.keys(S.entries).filter(d=>d>=START&&d<=END).sort().map(d=>({d,e:S.entries[d],c:calc(S.entries[d])})).filter(x=>x.c&&!x.c.err);
const sum=a=>a.reduce((x,y)=>x+y,0),sd=a=>{const m=sum(a)/a.length;return Math.sqrt(sum(a.map(x=>(x-m)**2))/a.length)};
const av=(l,k)=>{const v=l.map(x=>+x.e[k]).filter(x=>x>0);return v.length?sum(v)/v.length:null};
function st(l){const n=l.length;if(!n)return{n:0};const sl=l.map(x=>x.c.sleep),b=l.map(x=>x.c.bedN),w=l.map(x=>x.c.wakeM),ok=l.filter(x=>x.c.ok).length;
return{n,total:sum(sl),avg:sum(sl)/n,ok,pct:ok/n*100,bed:sum(b)/n,wake:sum(w)/n,bsd:n>1?sd(b):null,
reg:n>1?Math.max(0,100-sd(b)*100/120):null,cons:n>1?Math.max(0,100-(sd(b)+sd(w))/2*100/120):null,q:av(l,"quality"),c:av(l,"conc"),en:av(l,"energy"),
def:sum(l.map(x=>Math.max(0,TGT-x.c.sleep)))}}
const wk=i=>L().filter(x=>x.d>=add(START,i*7)&&x.d<=add(START,i*7+6));
const wItems=i=>[...Array(7)].map((_,k)=>{const d=add(START,i*7+k),c=calc(S.entries[d]);const ok=c&&!c.err;return{d,l:wd(d),v:ok?c.sleep/60:null,c:ok&&!c.ok?"#fbbf77":null,x:ok?c:null}});
const T0=clamp(today());S.sel=T0;S.m=T0.slice(0,7);S.w=Math.floor((P(T0)-P(START))/864e5/7);
const draft=d=>{const e=S.entries[d];S.draft=e?{...e}:{src:d===today()?"live":"retro"};S.msg=""};draft(S.sel);
function bars(it,o={}){const W=640,H=o.h||230,pl=40,pb=26,pt=12,n=it.length||1,mx=o.max||Math.max(...it.map(x=>x.v||0),o.t||0,1)*1.15,y=v=>H-pb-v/mx*(H-pb-pt),bw=(W-pl)/n,ax=o.ax||(v=>v.toFixed(0)+"h"),f=o.f||(v=>v.toFixed(1)+"h");
let s=`<svg viewBox="0 0 ${W} ${H}" class="ch" role="img" aria-label="${o.al||"Chart"}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8a9ff"/><stop offset="1" stop-color="#6a4cf0"/></linearGradient></defs>`;
for(let i=0;i<=4;i++){const v=mx*i/4;s+=`<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" class="gl"/><text x="${pl-6}" y="${y(v)+4}" class="ax" text-anchor="end">${ax(v)}</text>`}
it.forEach((x,i)=>{const cx=pl+bw*i+bw/2,w=Math.min(bw*.62,36);
if(x.v!=null)s+=`<rect x="${cx-w/2}" y="${y(x.v)}" width="${w}" height="${Math.max(2,H-pb-y(x.v))}" rx="6" fill="${x.c||"url(#g)"}"><title>${x.l}: ${f(x.v)}</title></rect>`;
else s+=`<rect x="${cx-w/2}" y="${H-pb-3}" width="${w}" height="3" rx="1.5" class="stub"/>`;
if(n<=16||i%Math.ceil(n/12)==0)s+=`<text x="${cx}" y="${H-8}" class="ax" text-anchor="middle">${x.l}</text>`});
if(o.t!=null)s+=`<line x1="${pl}" x2="${W}" y1="${y(o.t)}" y2="${y(o.t)}" class="tg"/><text x="${W}" y="${y(o.t)-5}" class="tgt" text-anchor="end">${o.tl}</text>`;return s+"</svg>"}
const empty=(t,m)=>`<div class="empty"><b>${t}</b>${m}</div>`;
const sc=(l,v,s)=>`<div class="card st"><div class="l">${l}</div><div class="big">${v}</div><div class="s">${s||""}</div></div>`;
const NA="–";
function dash(){const l=L(),s=st(l),day=Math.floor((P(today())-P(START))/864e5)+1,rg=day<1?"Starts 26 Oct 2026":day>105?"Period finished":"Day "+day+" of 105",c=2*Math.PI*70,p=s.n?s.pct:0;
const recent=l.slice(-30).map(x=>({l:dm(x.d),v:x.c.sleep/60,c:x.c.ok?null:"#fbbf77"}));
return`<section class="card hero"><svg viewBox="0 0 180 180" class="ring" role="img" aria-label="Goal progress"><circle cx="90" cy="90" r="70" class="rb"/><circle cx="90" cy="90" r="70" class="rf" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" transform="rotate(-90 90 90)"/><text x="90" y="100" text-anchor="middle" class="rt">${s.n?Math.round(p)+"%":NA}</text></svg>
<div><span class="pill">${rg}</span><h2 class="mt">${s.n?s.ok+" of "+s.n+" logged nights reached 7 hours":"Your first night is waiting"}</h2>
${s.n?`<div class="bar"><i style="width:${Math.min(100,s.avg/TGT*100)}%"></i></div><div class="mu">Average ${hm(s.avg)} against a 7h target</div>`:`<p class="mu">Goal: at least 7 hours of sleep every night before a school day. Add a night in the journal and your numbers appear here.</p>`}
<p><button class="btn" data-a="nav" data-v="journal">${s.n?"Open journal":"Log a night"}</button></p></div></section>
<div class="g g3 mt">${sc("Average sleep",s.n?hm(s.avg):NA,"per logged night")}${sc("Total slept",s.n?(s.total/60).toFixed(1)+" h":NA,s.n+" nights logged")}${sc("Nights ≥ 7h",s.n?s.ok:NA,s.n?s.pct.toFixed(0)+"% of logged nights":"")}${sc("Consistency",s.cons!=null?s.cons.toFixed(0)+"%":NA,"bedtime and wake-up spread")}${sc("Average bedtime",s.n?clock(s.bed):NA,"planned 20:30")}${sc("Average wake-up",s.n?clock(s.wake):NA,"planned 04:30")}</div>
<div class="card mt"><h3>Sleep per night</h3><p class="mu">Latest 30 logged nights. Amber bars fall short of 7 hours.</p>${recent.length?bars(recent,{t:7,tl:"7h target",al:"Sleep per night"}):empty("No nights logged yet","Your sleep chart fills in as you add journal entries.")}</div>
<div class="card mt"><h3>This week</h3><p class="mu">${dm(add(START,S.w*7))} – ${dm(add(START,S.w*7+6))}</p>${bars(wItems(S.w),{t:7,tl:"7h",h:200,al:"Weekly overview"})}</div>`}
function stars(k,lab,D){return`<label>${lab}</label><div class="rt5">${[1,2,3,4,5].map(i=>`<button type="button" data-a="rate" data-k="${k}" data-v="${i}" class="${D[k]==i?"on":""}" aria-label="${lab} ${i}">${k=="quality"?"★":i}</button>`).join("")}</div>`}
function pv(D){const c=calc(D);if(!c)return`<span class="mu">Enter bedtime and wake-up to see your sleep duration.</span>`;if(c.err)return`<span style="color:var(--bad)">${c.err}</span>`;
return`Time in bed <b>${hm(c.inbed)}</b> · Sleep <b>${hm(c.sleep)}</b><br><span class="pill ${c.ok?"ok":"no"}">${c.ok?"Goal met":"Below 7h"}</span> ${c.diff>=0?"+":"−"}${hm(c.diff)} vs target`}
function journal(){const D=S.draft,m=S.m,first=(new Date(P(m+"-01")).getUTCDay()+6)%7,dim=new Date(Date.UTC(+m.slice(0,4),+m.slice(5),0)).getUTCDate(),T=today();
let cells="";for(let i=0;i<first;i++)cells+="<span></span>";
for(let n=1;n<=dim;n++){const d=m+"-"+String(n).padStart(2,"0"),e=S.entries[d],c=calc(e),inr=d>=START&&d<=END;
cells+=`<button data-a="sel" data-d="${d}" ${inr?"":"disabled"} class="${[c&&!c.err?(c.ok?"ok":"no"):"",e&&e.src=="retro"?"re":"",d==S.sel?"sel":"",d==T?"tdy":""].join(" ")}" aria-label="${lon(d)}">${n}</button>`}
const mn=new Date(P(m+"-01")).toLocaleDateString("en-GB",{month:"long",year:"numeric",timeZone:"UTC"});
return`<div class="g g2"><div class="card"><div class="row"><button class="btn s2" data-a="mon" data-v="-1" ${m<="2026-10"?"disabled":""}>‹</button><h3>${mn}</h3><button class="btn s2" data-a="mon" data-v="1" ${m>="2027-02"?"disabled":""}>›</button></div>
<div class="cal mt">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x=>`<span class="h">${x}</span>`).join("")}${cells}</div>
<div class="leg"><span>Green: 7h or more</span><span>Amber: under 7h</span><span>Dashed outline: retrospective estimate</span></div>
<p class="row mt"><button class="btn s2" data-a="tod">Jump to today</button><button class="btn s2" data-a="csv">Export CSV</button></p></div>
<div class="card"><h3>${lon(S.sel)}</h3><p class="mu">Log the night that ended on this morning.</p>
<label>Entry type</label><div class="row" style="justify-content:flex-start;gap:18px"><label style="margin:0;color:var(--tx)"><input type="radio" name="src" data-k="src" value="live" ${D.src=="live"?"checked":""}> Recorded live</label><label style="margin:0;color:var(--tx)"><input type="radio" name="src" data-k="src" value="retro" ${D.src=="retro"?"checked":""}> Retrospective estimate</label></div>
<div class="f2"><div><label>Went to bed</label><input type="time" data-k="bed" value="${D.bed||""}"></div><div><label>Fell asleep (est.)</label><input type="time" data-k="asleep" value="${D.asleep||""}"></div><div><label>Woke up</label><input type="time" data-k="wake" value="${D.wake||""}"></div></div>
<button class="btn s2 mt" data-a="plan" type="button">Fill planned schedule (20:30 → 04:30)</button>
<div class="pv" id="pv">${pv(D)}</div>
<label>Times woken during the night</label><input type="number" min="0" max="30" data-k="wakes" value="${D.wakes??""}">
${stars("quality","Sleep quality",D)}${stars("energy","Morning energy",D)}${stars("conc","Concentration during the day",D)}
<label>Notes</label><textarea rows="3" data-k="notes">${(D.notes||"").replace(/</g,"&lt;")}</textarea>
${S.msg?`<div class="msg">${S.msg}</div>`:""}
<p class="row mt"><button class="btn" data-a="save">Save entry</button>${S.entries[S.sel]?`<button class="btn d" data-a="del">Delete entry</button>`:""}</p></div></div>`}
function week(){const i=S.w,it=wItems(i),l=wk(i),s=st(l);const best=l.length?l.reduce((a,b)=>b.c.sleep>a.c.sleep?b:a):null,worst=l.length?l.reduce((a,b)=>b.c.sleep<a.c.sleep?b:a):null;
return`<div class="row"><button class="btn s2" data-a="wk" data-v="-1" ${i<=0?"disabled":""}>‹ Previous</button><h2>Week ${i+1}: ${dm(add(START,i*7))} – ${dm(add(START,i*7+6))}</h2><button class="btn s2" data-a="wk" data-v="1" ${i>=14?"disabled":""}>Next ›</button></div>
<div class="g g3 mt">${sc("Average sleep",s.n?hm(s.avg):NA,s.n+" nights logged")}${sc("Best night",best?hm(best.c.sleep):NA,best?lon(best.d).split(",")[0]+" "+dm(best.d):"")}${sc("Worst night",worst?hm(worst.c.sleep):NA,worst?lon(worst.d).split(",")[0]+" "+dm(worst.d):"")}${sc("Nights ≥ 7h",s.n?s.ok+" / "+s.n:NA,"")}${sc("Goal met",s.n?s.pct.toFixed(0)+"%":NA,"of logged nights")}${sc("Avg quality",s.q?s.q.toFixed(1)+" / 5":NA,"")}${sc("Avg concentration",s.c?s.c.toFixed(1)+" / 5":NA,"")}</div>
<div class="card mt"><h3>Sleep against the 7-hour target</h3>${bars(it,{t:7,tl:"7h target",al:"Week sleep"})}${l.length?"":empty("No nights this week","Log nights in the journal to compare them with your target.")}</div>
<div class="card mt wrap"><table><tr><th>Day</th><th>In bed</th><th>Sleep</th><th>Vs 7h</th><th>Quality</th><th>Source</th></tr>${it.map(x=>{const e=S.entries[x.d];return`<tr><td>${x.l} ${dm(x.d)}</td><td>${x.x?hm(x.x.inbed):NA}</td><td>${x.x?hm(x.x.sleep):NA}</td><td>${x.x?(x.x.diff>=0?"+":"−")+hm(x.x.diff):NA}</td><td>${e&&e.quality?e.quality+"/5":NA}</td><td>${e?(e.src=="retro"?"Estimate":"Live"):NA}</td></tr>`}).join("")}</table></div>`}
function debt(){const l=L(),s=st(l),it=l.slice(-28).map(x=>({l:dm(x.d),v:Math.max(0,TGT-x.c.sleep)/60,c:"#ff8aa1"}));let cum=0;
const rows=[...Array(15)].map((_,i)=>{const w=wk(i);if(!w.length)return"";const d=st(w).def;cum+=d;return`<tr><td>Week ${i+1}</td><td>${w.length}</td><td>${hm(d)}</td><td>${hm(cum)}</td></tr>`}).join("");
return`<div class="g g3">${sc("Total sleep debt",s.n?hm(s.def):NA,"against 7h on logged nights")}${sc("Average deficit",s.n?hm(s.def/s.n):NA,"per logged night")}${sc("Nights short",s.n?s.n-s.ok:NA,"")}${sc("Consistency",s.cons!=null?s.cons.toFixed(0)+"%":NA,"bedtime + wake-up")}${sc("Bedtime regularity",s.reg!=null?s.reg.toFixed(0)+"%":NA,s.bsd!=null?"± "+Math.round(s.bsd)+" min spread":"needs 2+ nights")}</div>
<div class="card mt"><h3>Daily sleep deficit</h3><p class="mu">Hours missing from 7h. Nights at or above target show no bar. Extra sleep does not cancel debt.</p>${it.length?bars(it,{al:"Daily deficit",f:v=>hm(v*60)}):empty("No debt to show yet","Add nights to see your daily deficit.")}</div>
<div class="card mt wrap"><h3>Weekly accumulated deficit</h3>${rows?`<table><tr><th>Week</th><th>Nights</th><th>Deficit</th><th>Accumulated</th></tr>${rows}</table>`:empty("Nothing accumulated","Weekly totals appear once nights are logged.")}</div>`}
function pop(){const l=L(),s=st(l),first=l.filter(x=>x.e.src!="retro").length,re=l.length-first;
const ws=[...Array(15)].map((_,i)=>({i,l:wk(i)})),wa=ws.map(w=>({l:"W"+(w.i+1),v:w.l.length?st(w.l).avg/60:null,c:w.l.length&&st(w.l).avg<TGT?"#fbbf77":null})),wp=ws.map(w=>({l:"W"+(w.i+1),v:w.l.length?st(w.l).pct:null})),lw=ws.filter(w=>w.l.length);
const trend=lw.length>1?`Weekly success moved from ${st(lw[0].l).pct.toFixed(0)}% (week ${lw[0].i+1}) to ${st(lw[lw.length-1].l).pct.toFixed(0)}% (week ${lw[lw.length-1].i+1}).`:"Trend appears once two weeks contain data.";
return`<div class="pop"><div class="row noprint"><h2>POP progress report</h2><button class="btn" data-a="print">Print or save as PDF</button></div>
<div class="card mt"><h3>SMART goal</h3><p>“I sleep at least 7 hours every night before a school day during the period October 26, 2026, to February 7, 2027.”</p>
<h3>Initial schedule</h3><p class="mu">Wake-up 04:30 · target bedtime 20:30 (8 hours in bed) · minimum actual sleep 7 hours · evening routine starts 45 minutes before bedtime.</p></div>
<div class="g g3 mt">${sc("Nights logged",l.length+" / 105","")}${sc("Successful nights",s.n?s.ok:NA,s.n?s.pct.toFixed(0)+"% of logged":"")}${sc("Average sleep",s.n?hm(s.avg):NA,"")}${sc("Total sleep debt",s.n?hm(s.def):NA,"")}</div>
<div class="card mt"><h3>Weekly average sleep</h3>${lw.length?bars(wa,{t:7,tl:"7h target",al:"Weekly averages"}):empty("No data in the period yet","This report builds itself from your journal.")}</div>
<div class="card mt"><h3>Weekly success rate</h3><p class="mu">${trend}</p>${lw.length?bars(wp,{max:100,ax:v=>v.toFixed(0)+"%",f:v=>v.toFixed(0)+"%",al:"Weekly success"}):""}</div>
<div class="card mt wrap"><h3>Weekly performance</h3><table><tr><th>Week</th><th>Dates</th><th>Nights</th><th>Average</th><th>≥ 7h</th><th>Success</th></tr>${ws.map(w=>{const x=st(w.l);return`<tr><td>${w.i+1}</td><td>${dm(add(START,w.i*7))} – ${dm(add(START,w.i*7+6))}</td><td>${x.n}</td><td>${x.n?hm(x.avg):NA}</td><td>${x.n?x.ok:NA}</td><td>${x.n?x.pct.toFixed(0)+"%":NA}</td></tr>`}).join("")}</table></div>
<div class="card mt"><h3>Data sources</h3><p class="mu">${first} nights recorded live, ${re} nights entered retrospectively as estimates. Retrospective values are less reliable than measurements made on the day.</p></div>
<div class="card mt"><h3>Reflection</h3><textarea id="refl" placeholder="What worked, what did not, and what will you change?">${S.refl.replace(/</g,"&lt;")}</textarea></div></div>`}
const V={dash,journal,week,debt,pop},TABS=[["dash","Dashboard"],["journal","Journal"],["week","Weekly"],["debt","Sleep debt"],["pop","POP report"]];
function render(){$("#nav").innerHTML=TABS.map(t=>`<button data-a="nav" data-v="${t[0]}" class="${S.v==t[0]?"on":""}">${t[1]}</button>`).join("");$("#app").innerHTML=V[S.v]();
$("#mo").innerHTML=S.modal?`<div class="mo"><div class="card"><h3>Sleep journal CSV</h3><p class="mu">Copy this text into a .csv file, or try the download.</p><textarea id="csvt" readonly>${S.modal.replace(/</g,"&lt;")}</textarea><p class="row"><span><button class="btn" data-a="copy">Copy</button> <button class="btn s2" data-a="dl">Download</button></span><button class="btn s2" data-a="close">Close</button></p></div></div>`:""}
function csv(){const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';let r=["date,bed,asleep,wake,wakes,quality,energy,concentration,in_bed_min,sleep_min,met_7h,diff_min,source,notes"];
Object.keys(S.entries).sort().forEach(d=>{const e=S.entries[d],c=calc(e)||{};r.push([d,e.bed||"",e.asleep||"",e.wake||"",e.wakes??"",e.quality||"",e.energy||"",e.conc||"",c.inbed??"",c.sleep??"",c.ok==null?"":c.ok?"yes":"no",c.diff??"",e.src||"",q(e.notes)].join(","))});return r.join("\n")}
document.addEventListener("click",ev=>{const b=ev.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,v=b.dataset.v,D=S.draft;
if(a=="nav"){S.v=v}else if(a=="mon"){const[y,m]=S.m.split("-").map(Number),t=new Date(Date.UTC(y,m-1+ +v,1));S.m=F(t).slice(0,7)}
else if(a=="sel"){S.sel=b.dataset.d;draft(S.sel)}else if(a=="tod"){S.sel=T0;S.m=T0.slice(0,7);draft(T0)}
else if(a=="wk"){S.w=Math.max(0,Math.min(14,S.w+ +v))}else if(a=="rate"){D[b.dataset.k]=D[b.dataset.k]==v?"":+v}
else if(a=="plan"){D.bed="20:30";D.asleep="";D.wake="04:30"}
else if(a=="save"){const c=calc(D);if(!c||c.err){S.msg=c?c.err:"Enter both bedtime and wake-up time.";render();return}S.entries[S.sel]={...D};save();S.msg=""}
else if(a=="del"){if(!confirm("Delete this entry?"))return;delete S.entries[S.sel];save();draft(S.sel)}
else if(a=="csv"){S.modal=csv()}else if(a=="close"){S.modal=""}
else if(a=="copy"){try{navigator.clipboard.writeText(S.modal)}catch(e){$("#csvt").select()}return}
else if(a=="dl"){try{const u=URL.createObjectURL(new Blob([S.modal],{type:"text/csv"})),k=document.createElement("a");k.href=u;k.download="sleep-journal.csv";k.click()}catch(e){}return}
else if(a=="print"){try{window.print()}catch(e){}return}
render()});
document.addEventListener("input",ev=>{const t=ev.target;if(t.id=="refl"){S.refl=t.value;save();return}const k=t.dataset.k;if(!k)return;if(t.type=="radio"&&!t.checked)return;S.draft[k]=t.value;const p=$("#pv");if(p)p.innerHTML=pv(S.draft)});
render();
</script></body></html>
